<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Ponto & Deslocamento</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #2563eb;
            --background: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --success: #16a34a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--background); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; }
        h1 { text-align: center; margin-bottom: 20px; font-size: 1.5rem; color: var(--primary); }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .grid-botoes { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 15px; }
        button { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; width: 100%; }
        button:active { transform: scale(0.98); }
        .btn-success { background: var(--success); }
        .input-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        select, input { padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 1rem; width: 100%; }
        .switch-container { display: flex; align-items: center; justify-content: space-between; margin: 15px 0; }
        .resumo-horas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; text-align: center; }
        .resumo-item { background: #f1f5f9; padding: 10px; border-radius: 8px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f1f5f9; }
    </style>
</head>
<body>

<div class="container">
    <h1>⏱️ Meu Controle de Ponto</h1>

    <div class="card">
        <h3>Registrar Momento</h3>
        
        <div class="input-group" style="margin-top: 10px;">
            <label for="transporte">Meio de Transporte de Hoje:</label>
            <select id="transporte">
                <option value="Carro">🚗 Carro</option>
                <option value="Transporte Público">🚌 Transporte Público</option>
            </select>
        </div>

        <div class="switch-container">
            <span>Disponível Full Time (Sem Almoço)</span>
            <input type="checkbox" id="fulltime" style="width: auto; transform: scale(1.3);">
        </div>

        <div class="grid-botoes">
            <button onclick="registrar('saida_casa')">🏠 Saí de Casa</button>
            <button onclick="registrar('chegada_trabalho')">🏢 Cheguei ao Trabalho</button>
            <button onclick="registrar('saida_trabalho')">🛠️ Saí do Trabalho</button>
            <button onclick="registrar('chegada_casa')" class="btn-success">🏁 Cheguei em Casa</button>
        </div>
    </div>

    <div class="card">
        <h3>Resumo de Horas</h3>
        <div class="resumo-horas">
            <div class="resumo-item">Semana<div id="total-semana">0h 00m</div></div>
            <div class="resumo-item">Mês<div id="total-mes">0h 00m</div></div>
        </div>
    </div>

    <div class="card">
        <h3>Histórico Recente</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Total</th>
                        <th>Cond.</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // CONFIGURAÇÃO DO SUPABASE (Substitua com os seus dados)
    const SUPABASE_URL = "https://SEU_PROJECT_ID.supabase.co";
    const SUPABASE_KEY = "SUA_SUPABASE_ANON_KEY";
    const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const hoje = new Date().toISOString().split('T')[0];

    // FUNÇÃO PARA REGISTRAR O PONTO
    async function registrar(coluna) {
        const agora = new Date().toLocaleTimeString('pt-BR', { hour12: false });
        const transporte = document.getElementById('transporte').value;
        const isFullTime = document.getElementById('fulltime').checked;

        // Tenta buscar se já existe registro hoje
        const { data: dadosExistentes } = await supabase
            .from('registros_ponto')
            .select('id')
            .eq('data', hoje)
            .single();

        let erro;

        if (dadosExistentes) {
            // Se já iniciou o dia, atualiza a coluna do botão clicado
            const dadosUpdate = { [coluna]: agora, almoco_fulltime: isFullTime };
            // Só atualiza o transporte no primeiro botão ou mantém
            if(coluna === 'saida_casa') dadosUpdate.meio_transporte = transporte;
            
            const { error } = await supabase
                .from('registros_ponto')
                .update(dadosUpdate)
                .eq('data', hoje);
            erro = error;
        } else {
            // Se for o primeiro clique do dia (geralmente saida_casa)
            const { error } = await supabase
                .from('registros_ponto')
                .insert([{
                    data: hoje,
                    [coluna]: agora,
                    meio_transporte: transporte,
                    almoco_fulltime: isFullTime
                }]);
            erro = error;
        }

        if (erro) {
            alert("Erro ao salvar: " + erro.message);
        } else {
            alert("Ponto gravado com sucesso!");
            carregarHistorico REmRelatorios();
        }
    }

    // FUNÇÃO PARA BUSCAR DADOS E CALCULAR RELATÓRIOS
    async function carregarHistoricoREmRelatorios() {
        const { data: registros, error } = await supabase
            .from('registros_ponto')
            .select('*')
            .order('data', { ascending: false });

        if (error) return;

        const tbody = document.getElementById('tabela-corpo');
        tbody.innerHTML = "";

        let minutosSemana = 0;
        let minutosMes = 0;

        registros.forEach(r => {
            // Cálculo básico de horas trabalhadas no dia (de saída de casa até chegada em casa)
            let textoTotalDia = "--:--";
            
            if (r.saida_casa && r.chegada_casa) {
                const [h1, m1] = r.saida_casa.split(':').map(Number);
                const [h2, m2] = r.chegada_casa.split(':').map(Number);
                
                let diferencaMinutos = (h2 * 60 + m2) - (h1 * 60 + m1);
                
                // Se NÃO for fulltime, desconta 1 hora padrão de almoço (60 min)
                if (!r.almoco_fulltime) {
                    diferencaMinutos -= 60;
                }

                if (diferencaMinutos > 0) {
                    const hrs = Math.floor(diferencaMinutos / 60);
                    const mins = diferencaMinutos % 60;
                    textoTotalDia = `${hrs}h ${mins.toString().padStart(2, '0')}m`;

                    // Soma acumuladores (Aqui você pode refinar filtros por data exata depois)
                    minutosMes += diferencaMinutos;
                    minutosSemana += diferencaMinutos; // Exemplo simples somando tudo para teste
                }
            }

            // Injeta na tabela do histórico
            const dataFormatada = new Date(r.data + 'T00:00:00').toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit'});
            tbody.innerHTML += `
                <tr>
                    <td>${dataFormatada}</td>
                    <td>${textoTotalDia}</td>
                    <td>${r.meio_transporte === 'Carro' ? '🚗' : '🚌'}</td>
                </tr>
            `;
        });

        // Atualiza os painéis de totais na tela
        document.getElementById('total-semana').innerText = `${Math.floor(minutosSemana / 60)}h ${(minutosSemana % 60).toString().padStart(2, '0')}m`;
        document.getElementById('total-mes').innerText = `${Math.floor(minutosMes / 60)}h ${(minutosMes % 60).toString().padStart(2, '0')}m`;
    }

    // Inicializa ao abrir a página
    carregarHistoricoREmRelatorios();
</script>
</body>
</html>
