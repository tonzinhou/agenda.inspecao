<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Ponto</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --background: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --success: #16a34a;
            --excel: #107c41;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--background); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; }
        h1 { text-align: center; margin-bottom: 20px; font-size: 1.5rem; color: var(--primary); }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .grid-botoes { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 15px; }
        button { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; width: 100%; }
        button:active { transform: scale(0.98); }
        .btn-success { background: var(--success); }
        .btn-excel { background: var(--excel); margin-top: 15px; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .input-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        select, input { padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 1rem; width: 100%; }
        .switch-container { display: flex; align-items: center; justify-content: space-between; margin: 15px 0; }
        .painel-almoco-condicional { background: #f1f5f9; padding: 15px; border-radius: 8px; margin-top: 10px; display: none; border-left: 4px solid var(--success); }
        .resumo-horas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; text-align: center; }
        .resumo-item { background: #f1f5f9; padding: 10px; border-radius: 8px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f1f5f9; }
    </style>
</head>
<body>

<div class="container">
    <h1>⏱️ Meu Controle de Ponto</h1>

    <div class="card">
        <h3>Registrar Momento</h3>
        
        <div class="input-row" style="margin-top: 15px;">
            <div class="input-group">
                <label for="data-ponto">Data:</label>
                <input type="date" id="data-ponto">
            </div>
            <div class="input-group">
                <label for="hora-ponto">Hora:</label>
                <input type="time" id="hora-ponto">
            </div>
        </div>
        
        <div class="input-group">
            <label for="forma-trabalho">Forma de Trabalho:</label>
            <select id="forma-trabalho">
                <option value="Home Office">🏠 Home Office</option>
                <option value="Vistoria Cautelar">📋 Vistoria Cautelar</option>
            </select>
        </div>

        <div class="grid-botoes">
            <button onclick="registrarPonto('entrada')">🏢 Início de Jornada</button>
            <button onclick="dispararFimJornada()" class="btn-success">🛠️ Fim de Jornada</button>
        </div>

        <div id="painel-almoco" class="painel-almoco-condicional">
            <div class="switch-container" style="margin: 0 0 10px 0;">
                <span style="font-weight: bold;">Teve intervalo de Almoço hoje?</span>
                <input type="checkbox" id="teve-almoco" onchange="alternarCampoMinutos()" style="width: auto; transform: scale(1.3);">
            </div>
            
            <div id="grupo-minutos-almoco" class="input-group" style="display: none; margin-bottom: 10px;">
                <label for="tempo-almoco">Duração do Almoço (em minutos):</label>
                <input type="number" id="tempo-almoco" value="60" min="0" placeholder="Ex: 60">
            </div>

            <button onclick="confirmarFimJornadaComAlmoco()" style="background: var(--success); padding: 10px; font-size: 0.9rem;">Confirmar e Salvar Fim de Jornada</button>
        </div>
    </div>

    <div class="card">
        <h3>Resumo de Horas</h3>
        <div class="resumo-horas">
            <div class="resumo-item">Semana Atual<div id="total-semana">0h 00m</div></div>
            <div class="resumo-item">Mês Atual<div id="total-mes">0h 00m</div></div>
        </div>
        <button onclick="exportarParaExcel()" class="btn-excel">🟢 Exportar Planilha Excel</button>
    </div>

    <div class="card">
        <h3>Histórico Recente</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Tempo Trabalhado</th>
                        <th>Formas de Trabalho</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCxV13m" + "O6K9g9l8X_2D" + "xL3S6qWpZt8R4Y",
        authDomain: "controle-de-horas-78e02.firebaseapp.com",
        databaseURL: "https://controle-de-horas-78e02-default-rtdb.firebaseio.com/",
        projectId: "controle-de-horas-78e02",
        storageBucket: "controle-de-horas-78e02.appspot.com",
        messagingSenderId: "107903444886",
        appId: "1:107903444886:web:91ff373f4af31d74df9fb7"
    };

    firebase.initializeApp(firebaseConfig);
    const bancoDados = firebase.database();

    function inicializarCamposDataHora() {
        const agora = new Date();
        
        // Ajuste para pegar o Ano, Mês e Dia corretos do fuso horário local (Brasília)
        const ano = agora.getFullYear();
        const mes = String(agora.getMonth() + 1).padStart(2, '0');
        const dia = String(agora.getDate()).padStart(2, '0');
        const dataHoje = ${ano}-${mes}-${dia};
        
        const horaAtual = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', hour12: false });
        
        document.getElementById('data-ponto').value = dataHoje;
        document.getElementById('hora-ponto').value = horaAtual;
        
        document.getElementById('painel-almoco').style.display = 'none';
        document.getElementById('teve-almoco').checked = false;
        document.getElementById('grupo-minutos-almoco').style.display = 'none';
    }

    function dispararFimJornada() {
        document.getElementById('painel-almoco').style.display = 'block';
        window.scrollTo({ top: document.getElementById('painel-almoco').offsetTop, behavior: 'smooth' });
    }

    function alternarCampoMinutos() {
        const teveAlmoco = document.getElementById('teve-almoco').checked;
        document.getElementById('grupo-minutos-almoco').style.display = teveAlmoco ? 'flex' : 'none';
    }

    async function confirmarFimJornadaComAlmoco() {
        const teveAlmoco = document.getElementById('teve-almoco').checked;
        let minutosDesconto = 0;

        if (teveAlmoco) {
            minutosDesconto = parseInt(document.getElementById('tempo-almoco').value) || 0;
        }

        await registrarPonto('saida', minutosDesconto);
    }

    async function registrarPonto(tipoMovimento, minutosAlmocoOpcional = null) {
        const dataSelecionada = document.getElementById('data-ponto').value;
        const horaSelecionada = document.getElementById('hora-ponto').value + ":00"; 
        const trabalho = document.getElementById('forma-trabalho').value;

        if (!dataSelecionada || !horaSelecionada) {
            alert("Por favor, preencha a data e a hora antes de registrar.");
            return;
        }

        const timestampId = new Date().getTime(); 

        const novoRegistro = {
            data: dataSelecionada,
            hora: horaSelecionada,
            tipo: tipoMovimento, 
            forma_trabalho: trabalho
        };

        if (minutosAlmocoOpcional !== null) {
            novoRegistro['minutos_almoco'] = minutosAlmocoOpcional;
        }

        try {
            await bancoDados.ref('batidas_ponto/' + timestampId).set(novoRegistro);
            alert("Ponto gravado com sucesso!");
            inicializarCamposDataHora();
            carregarHistoricoREmRelatorios();
        } catch (erro) {
            alert("Erro ao salvar: " + erro.message);
        }
    }

    function obterLimitesSemanaAtual() {
        const atual = new Date();
        const diaSemana = atual.getDay(); 
        const distanciaParaSegunda = diaSemana === 0 ? -6 : 1 - diaSemana;
        
        const segunda = new Date(atual);
        segunda.setDate(atual.getDate() + distanciaParaSegunda);
        segunda.setHours(0,0,0,0);
        
        const domingo = new Date(segunda);
        domingo.setDate(segunda.getDate() + 6);
        domingo.setHours(23,59,59,999);
        
        return { segunda, domingo };
    }

    async function carregarHistoricoREmRelatorios() {
        try {
            const snapshot = await bancoDados.ref('batidas_ponto').once('value');
            const dadosObjeto = snapshot.val() || {};
            const batidas = Object.values(dadosObjeto);

            // Agrupa todas as batidas por data para calcular os intervalos corretamente
            const diasAgrupados = {};
            batidas.forEach(b => {
                if (!diasAgrupados[b.data]) {
                    diasAgrupados[b.data] = [];
                }
                diasAgrupados[b.data].push(b);
            });

            const datasOrdenadas = Object.keys(diasAgrupados).sort((a, b) => b.localeCompare(a));
            const tbody = document.getElementById('tabela-corpo');
            tbody.innerHTML = "";

            let minutosSemana = 0;
            let minutesMes = 0;

            const { segunda, domingo } = obterLimitesSemanaAtual();
            const hojeData = new Date();
            const mesAtual = hojeData.getMonth();
            const anoAtual = hojeData.getFullYear();

            datasOrdenadas.forEach(dataStr => {
                const batidasDoDia = diasAgrupados[dataStr].sort((a, b) => a.hora.localeCompare(b.hora));
                
                let minutosTrabalhadosNoDia = 0;
                let formasDoDia = new Set();
                let horaEntradaAtual = null;

                batidasDoDia.forEach(b => {
                    if (b.forma_trabalho) {
                        formasDoDia.add(b.forma_trabalho === 'Home Office' ? '🏠 HO' : '📋 Vistoria');
                    }
                    
                    if (b.tipo === 'entrada') {
                        horaEntradaAtual = b.hora;
                    } else if (b.tipo === 'saida' && horaEntradaAtual) {
                        const [h1, m1] = horaEntradaAtual.split(':').map(Number);
                        const [h2, m2] = b.hora.split(':').map(Number);
                        
                        let diferenca = (h2 * 60 + m2) - (h1 * 60 + m1);
                        const descontoAlmoco = b.minutos_almoco ? Number(b.minutos_almoco) : 0;
                        diferenca -= descontoAlmoco;
                        
                        if (diferenca > 0) minutosTrabalhadosNoDia += diferenca;
                        horaEntradaAtual = null; // reseta para o próximo par de batidas do dia
                    }
                });

                const dataObjeto = new Date(dataStr + 'T00:00:00');
                if (dataObjeto >= segunda && dataObjeto <= domingo) minutosSemana += minutosTrabalhadosNoDia;
                if (dataObjeto.getMonth() === mesAtual && dataObjeto.getFullYear() === anoAtual) minutesMes += minutosTrabalhadosNoDia;

                let textoTotalDia = "--:--";
                if (minutosTrabalhadosNoDia > 0) {
                    const hrs = Math.floor(minutosTrabalhadosNoDia / 60);
                    const mins = minutosTrabalhadosNoDia % 60;
                    textoTotalDia = `${hrs}h ${mins.toString().padStart(2, '0')}m`;
                }

                const dataFormatada = dataObjeto.toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit'});
                const formasExibir = formasDoDia.size > 0 ? Array.from(formasDoDia).join(' / ') : '--';

                tbody.innerHTML += `
                    <tr>
                        <td>${dataFormatada}</td>
                        <td>${textoTotalDia}</td>
                        <td>${formasExibir}</td>
                    </tr>
                `;
            });

            document.getElementById('total-semana').innerText = `${Math.floor(minutosSemana / 60)}h ${(minutosSemana % 60).toString().padStart(2, '0')}m`;
            document.getElementById('total-mes').innerText = `${Math.floor(minutesMes / 60)}h ${(minutesMes % 60).toString().padStart(2, '0')}m`;
        } catch (e) {
            console.error("Erro ao ler relatórios: ", e);
        }
    }

    async function exportarParaExcel() {
        try {
            const snapshot = await bancoDados.ref('batidas_ponto').once('value');
            const dadosObjeto = snapshot.val() || {};
            const batidas = Object.values(dadosObjeto).sort((a, b) => a.data.localeCompare(b.data) || a.hora.localeCompare(b.hora));

            if (batidas.length === 0) {
                alert("Nenhum dado encontrado para exportar.");
                return;
            }

            let conteudoCSV = "\uFEFF"; 
            conteudoCSV += "Data;Hora;Movimento;Desconto Almoço (Minutos);Forma de Trabalho\n";

            batidas.forEach(b => {
                const minAlmoco = b.minutos_almoco || 0;
                const acao = b.tipo === 'entrada' ? 'Início Jornada' : 'Fim Jornada';
                conteudoCSV += `${b.data};${b.hora};${acao};${minAlmoco};${b.forma_trabalho || ""}\n`;
            });

            const blob = new Blob([conteudoCSV], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const linkDownload = document.createElement("a");
            
            linkDownload.setAttribute("href", url);
            linkDownload.setAttribute("download", `Controle_de_Ponto_${new Date().toLocaleDateString('pt-BR').replace(/\//g, '_')}.csv`);
            document.body.appendChild(linkDownload);
            
            linkDownload.click();
            document.body.removeChild(linkDownload);
        } catch (err) {
            alert("Erro na exportação.");
        }
    }

    inicializarCamposDataHora();
    carregarHistoricoREmRelatorios();
</script>
</body>
</html>
